name: Deploy to Cloudflare Pages on Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-public:
    name: Deploy Bakery Public to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bakery-public/package-lock.json

      - name: Install Dependencies
        run: |
          cd bakery-public
          npm ci

      - name: Build Application
        run: |
          cd bakery-public
          npm run generate

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6c0574c70269560286ef958f8bcf56d7
          command: pages deploy bakery-public/.output/public --project-name=bakery-public --commit-dirty=true

  deploy-admin:
    name: Deploy Bakery Admin to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bakery-admin/package-lock.json

      - name: Install Dependencies
        run: |
          cd bakery-admin
          npm ci

      - name: Build Application
        run: |
          cd bakery-admin
          npm run generate

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6c0574c70269560286ef958f8bcf56d7
          command: pages deploy bakery-admin/.output/public --project-name=bakery-admin --commit-dirty=true
